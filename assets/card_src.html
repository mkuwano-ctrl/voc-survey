<!doctype html>
<html lang="ja"><head><meta charset="utf-8" />
<title>配信カード画像（元）</title>
<style>
  body { margin: 0; background: #ddd; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  /* Flex Message の hero 用。20:13（1040×676） */
  #card { width: 1040px; height: 676px; position: relative; overflow: hidden; background: #f6f2ea; color: #1f2328; }
  #card .band { position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: #d9452b; }
  #card .body { position: absolute; left: 92px; top: 96px; right: 80px; }
  #card .eyebrow { font-size: 30px; letter-spacing: .18em; color: #8a5a4a; font-weight: 600; }
  #card h1 { margin: 22px 0 0; font-size: 74px; line-height: 1.2; font-weight: 800; letter-spacing: .01em; }
  #card p { margin: 34px 0 0; font-size: 34px; line-height: 1.5; color: #4b5563; }
  #card .pill { position: absolute; left: 92px; bottom: 84px; display: inline-flex; align-items: center; gap: 16px; background: #fff; border: 3px solid #e7ddd2; border-radius: 999px; padding: 18px 34px; font-size: 34px; font-weight: 700; color: #d9452b; }
  #card .pill .n { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: #d9452b; color: #fff; font-size: 30px; }
  #card .mark { position: absolute; right: 84px; bottom: 64px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3e8, #f1c9b5 70%, #e7b39b); display: grid; place-items: center; font-size: 150px; }
</style></head>
<body>
<div id="card">
  <div class="band"></div>
  <div class="body">
    <div class="eyebrow">THANK YOU</div>
    <h1>ご来店<br>ありがとうございました</h1>
    <p>お客様により良い時間をお届けするため、<br>ご感想をお聞かせください。</p>
  </div>
  <div class="pill"><span class="n">3</span>問・30秒で終わります</div>
  <div class="mark">🍽️</div>
</div>
</body></html>
